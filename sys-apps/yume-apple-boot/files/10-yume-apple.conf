# Apple Silicon initramfs: vendor firmware from the ESP and the early drivers.
add_dracutmodules+=" yume-apple-vendorfw yume-apple-modules "
# dwc3 creates its xHCI device asynchronously; load it explicitly so USB
# works in emergency shells after udev has stopped.
force_drivers+=" xhci-plat-hcd "
